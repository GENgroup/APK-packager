name: Собрать APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Название приложения (как будет на телефоне)'
        required: true
      target_filename:
        description: 'Имя HTML-файла в Download/GEN/, который будет открывать приложение'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      TARGET_FILENAME: ${{ inputs.target_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Добавить sdkmanager в PATH
        run: echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Принять лицензии Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Установить нужные компоненты Android SDK
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Подставить название и имя файла
        run: |
          SAFE_ID=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g' | sed -E 's/^([0-9])/a\1/' | sed -E 's/^_+|_+$//g')
          APP_ID="com.gengroup.packager.${SAFE_ID}"
          echo "Итоговый package id: $APP_ID"
          sed -i "s#APPLICATION_ID_PLACEHOLDER#${APP_ID}#" app/build.gradle
          sed -i "s#APP_NAME_PLACEHOLDER#${APP_NAME}#" app/src/main/res/values/strings.xml
          sed -i "s#TARGET_FILENAME_PLACEHOLDER#${TARGET_FILENAME}#" app/src/main/java/com/gengroup/packager/MainActivity.java

      - name: Подставить иконку
        run: |
          if [ ! -f input/icon.png ]; then
            echo "::error::Не найден файл input/icon.png — положите иконку в папку input и запустите заново"
            exit 1
          fi
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$dir
            cp input/icon.png app/src/main/res/mipmap-$dir/ic_launcher.png
            cp input/icon.png app/src/main/res/mipmap-$dir/ic_launcher_round.png
          done

      - name: Сгенерировать Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Собрать APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Подготовить файл к публикации
        run: |
          SAFE_NAME=$(echo "$APP_NAME" | sed -E 's/[^A-Za-z0-9_-]+/_/g')
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/${SAFE_NAME}.apk"
          echo "APK_PATH=out/${SAFE_NAME}.apk" >> "$GITHUB_ENV"

      - name: Опубликовать релиз со ссылкой для скачивания
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ inputs.app_name }} — сборка №${{ github.run_number }}"
          files: ${{ env.APK_PATH }}
